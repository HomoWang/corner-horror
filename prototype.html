<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>307：開端</title>
    <style>
      @font-face {
        font-family: "Room307 Cute Handwriting";
        src: url("/assets/fonts/LXGWWenKaiTC-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Room307 Note Handwriting";
        src: url("/assets/fonts/JasonHandwriting2.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        --aim-x: 50vw;
        --aim-y: 50vh;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #211b18;
        color: #c8b7ad;
        font-family: "Noto Sans TC", system-ui, sans-serif;
      }

      body {
        cursor: none;
      }

      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at var(--aim-x) var(--aim-y), rgba(255, 222, 174, 0.34), transparent 18rem),
          linear-gradient(#2b211c, #17110f);
      }

      #room-scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #080807;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        --scene-x: 0%;
        --scene-y: 0%;
        --scene-scale: 1.055;
        --scene-origin-x: 50%;
        --scene-origin-y: 50%;
      }

      #room-background,
      #room-state-layer {
        position: absolute;
        inset: -8%;
        width: 116%;
        height: 116%;
        transform-origin: var(--scene-origin-x) var(--scene-origin-y);
        transform:
          translate(var(--scene-x), var(--scene-y))
          scale(var(--scene-scale));
        transition:
          transform 420ms cubic-bezier(0.22, 0.7, 0.2, 1),
          filter 180ms ease-out,
          opacity 150ms ease-out;
      }

      #room-scene.dragging #room-background,
      #room-scene.dragging #room-state-layer {
        transition:
          transform 70ms linear,
          filter 180ms ease-out,
          opacity 150ms ease-out;
      }

      #room-scene.switching-wall #room-background,
      #room-scene.switching-wall #room-state-layer {
        transition:
          transform 0ms linear,
          filter 180ms ease-out,
          opacity 150ms ease-out;
      }

      #room-background {
        object-fit: cover;
        user-select: none;
        filter: brightness(1.08) contrast(1.04) saturate(0.88);
      }

      #room-state-layer {
        pointer-events: none;
      }

      .wardrobe-state-overlay {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        clip-path: inset(15% 49% 33% 27%);
      }

      #room-scene.changing-view #room-background {
        opacity: 0.78;
        filter: brightness(0.82) contrast(1.02) saturate(0.86);
      }

      body.tape-playing #room-background,
      body.tape-playing #room-state-layer {
        animation: tape-room-flicker 1.7s steps(2, end) infinite;
      }

      body.tape-distorted #room-background,
      body.tape-distorted #room-state-layer {
        animation: tape-room-distortion 0.18s steps(2, end) infinite;
      }

      @keyframes tape-room-flicker {
        0%, 76%, 100% { filter: brightness(1.02) contrast(1.05) saturate(0.82); }
        78% { filter: brightness(0.72) contrast(1.18) saturate(0.62); }
        82% { filter: brightness(0.94) contrast(1.08) saturate(0.76); }
      }

      @keyframes tape-room-distortion {
        0% { transform: translate(var(--scene-x), var(--scene-y)) scale(var(--scene-scale)); }
        50% { transform: translate(calc(var(--scene-x) - 0.35%), var(--scene-y)) scale(var(--scene-scale)); }
      }

      .room-prop {
        position: absolute;
        height: auto;
        object-fit: contain;
        opacity: 0.94;
        transform: translate(-50%, -50%);
        filter: brightness(0.54) contrast(0.98) saturate(0.46) sepia(0.08)
          drop-shadow(0 0.15rem 0.14rem rgba(0, 0, 0, 0.72));
      }

      .receipt-prop {
        opacity: 0.94;
        filter: brightness(0.82) contrast(1.02) saturate(0.52) sepia(0.16)
          drop-shadow(0 0.12rem 0.1rem rgba(0, 0, 0, 0.76));
      }

      .firefighter-mask-prop {
        z-index: 1;
        opacity: 0.84;
        filter: brightness(0.57) contrast(0.94) saturate(0.32) sepia(0.08)
          blur(0.18px) drop-shadow(0.11rem 0.2rem 0.13rem rgba(0, 0, 0, 0.78));
        transform: rotate(1.5deg);
        transform-origin: 52% 4%;
      }

      .firefighter-mask-hook {
        position: absolute;
        z-index: 0;
        left: 59.48%;
        top: 30.72%;
        width: 0.42%;
        aspect-ratio: 1 / 1.7;
        border: 0.06rem solid rgba(37, 31, 26, 0.88);
        border-radius: 50% 50% 38% 38%;
        background: linear-gradient(90deg, #211c18, #66584b 47%, #17130f);
        box-shadow: 0.08rem 0.12rem 0.12rem rgba(0, 0, 0, 0.84);
        transform: translate(-50%, -50%);
      }

      .story-wall-photo {
        position: absolute;
        z-index: 1;
        margin: 0;
        padding: 0.42%;
        overflow: hidden;
        background: linear-gradient(135deg, #3a291f, #17100c 72%);
        border: 0.18rem solid #130d0a;
        box-shadow:
          inset 0 0 0 0.12rem rgba(129, 91, 60, 0.34),
          0 0.5rem 0.55rem rgba(0, 0, 0, 0.82),
          0 0 0.25rem rgba(0, 0, 0, 0.9);
        transform: translate(-50%, -50%);
      }

      .story-wall-photo::after {
        content: '';
        position: absolute;
        inset: 0.42%;
        pointer-events: none;
        box-shadow: inset 0 0 0.6rem rgba(12, 8, 6, 0.54);
      }

      .story-wall-photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.72) contrast(1.04) saturate(0.78) sepia(0.05);
      }

      .story-wall-photo.family-photo {
        left: 38%;
        top: 31.5%;
        width: 3.5%;
        aspect-ratio: 1.24;
        transform: translate(-50%, -50%);
      }

      .story-wall-photo.firefighter-photo {
        left: 51%;
        top: 31.5%;
        width: 3.2%;
        aspect-ratio: 1.04;
        transform: translate(-50%, -50%);
      }

      .story-wall-photo.girlfriend-photo {
        left: 48%;
        top: 44%;
        width: 3.5%;
        aspect-ratio: 1.24;
        transform: translate(-50%, -50%);
      }

      .story-wall-photo.couple-photo {
        left: 57.5%;
        top: 31.5%;
        width: 3.5%;
        aspect-ratio: 1.24;
        transform: translate(-50%, -50%);
      }

      .story-wall-photo.couple-photo.empty {
        background:
          linear-gradient(142deg, rgba(70, 49, 37, 0.16), transparent 42%),
          #090706;
      }

      .story-wall-photo.couple-photo.empty::before {
        content: '';
        position: absolute;
        inset: 9%;
        border: 1px solid rgba(91, 67, 51, 0.28);
        background: rgba(4, 3, 3, 0.72);
        box-shadow: inset 0 0 0.75rem rgba(0, 0, 0, 0.9);
      }

      .story-wall-award {
        position: absolute;
        z-index: 1;
        width: 2.8%;
        aspect-ratio: 1086 / 1448;
        overflow: hidden;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        transform: translate(-50%, -50%);
        filter: brightness(0.58) contrast(1.04) saturate(0.6) sepia(0.05)
          drop-shadow(0 0.26rem 0.22rem rgba(0, 0, 0, 0.86));
        user-select: none;
      }

      .story-wall-award.award-one {
        left: 44.5%;
        top: 31.5%;
        background-position: left center;
        transform: translate(-50%, -50%);
      }

      .story-wall-award.award-two {
        left: 41.5%;
        top: 44%;
        background-position: center center;
        transform: translate(-50%, -50%);
      }

      .story-wall-award.award-three {
        left: 54.5%;
        top: 44%;
        background-position: right center;
        transform: translate(-50%, -50%);
      }

      .story-wall-medals {
        position: absolute;
        z-index: 1;
        left: 64.5%;
        top: 38%;
        width: 3.6%;
        height: auto;
        transform: translate(-50%, -50%);
        filter: brightness(0.46) contrast(1.08) saturate(0.54) sepia(0.06)
          drop-shadow(0 0.24rem 0.2rem rgba(0, 0, 0, 0.88));
        user-select: none;
      }

      body.photo-memory-playing::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 31;
        pointer-events: none;
        background: #d7c4aa;
        mix-blend-mode: screen;
        animation: photo-memory-flash 9.2s steps(1, end) both;
      }

      body.photo-memory-playing #room-background,
      body.photo-memory-playing #room-state-layer {
        animation: photo-memory-room 9.2s cubic-bezier(0.2, 0.72, 0.2, 1) both;
      }

      body.photo-memory-playing .story-wall-photo.couple-photo {
        animation: photo-memory-frame 9.2s cubic-bezier(0.2, 0.72, 0.2, 1) both;
      }

      @keyframes photo-memory-flash {
        0%, 8%, 15%, 23%, 31%, 100% { opacity: 0; }
        9% { opacity: 0.24; }
        16% { opacity: 0.1; }
        24% { opacity: 0.32; }
        32% { opacity: 0.07; }
      }

      @keyframes photo-memory-room {
        0% {
          transform: translate(var(--scene-x), var(--scene-y)) scale(var(--scene-scale));
          filter: brightness(1) contrast(1) saturate(1);
        }
        24% {
          transform: translate(var(--scene-x), var(--scene-y)) scale(calc(var(--scene-scale) + 0.05));
          filter: brightness(0.58) contrast(1.26) saturate(0.58);
        }
        58% {
          transform: translate(var(--scene-x), var(--scene-y)) scale(calc(var(--scene-scale) + 0.025));
          filter: brightness(0.82) contrast(1.12) saturate(0.72);
        }
        100% {
          transform: translate(var(--scene-x), var(--scene-y)) scale(var(--scene-scale));
          filter: brightness(1) contrast(1) saturate(1);
        }
      }

      @keyframes photo-memory-frame {
        0% { filter: brightness(0.7) saturate(0.72); }
        18% { filter: brightness(1.65) contrast(1.18) saturate(0.32); }
        30% { filter: brightness(0.48) contrast(1.35) saturate(0.2); }
        48% { filter: brightness(1.2) contrast(1.08) saturate(0.62); }
        100% { filter: brightness(0.78) contrast(1.04) saturate(0.78); }
      }

      .antenna-prop {
        opacity: 0.9;
        mix-blend-mode: multiply;
        filter: brightness(0.55) contrast(1.02) saturate(0.28) sepia(0.08)
          drop-shadow(0 0.16rem 0.12rem rgba(0, 0, 0, 0.78));
        transform: translate(-50%, -50%) rotate(7deg);
      }

      body.bed-scare::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 80;
        pointer-events: none;
        background: #000;
        animation: bed-scare-blackout 1.25s steps(2, end) both;
      }

      @keyframes bed-scare-blackout {
        0%, 18% { opacity: 0; }
        20%, 72% { opacity: 0.96; }
        74%, 100% { opacity: 0; }
      }

      body.chapter-ending #room-scene,
      body.chapter-ending #flashlight,
      body.chapter-ending #cursor,
      body.chapter-ending #hud,
      body.chapter-ending #quick-slot {
        opacity: 0;
        transition: opacity 900ms ease;
      }

      #chapter-complete {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: grid;
        place-content: center;
        gap: 0.55rem;
        color: #d8d4cf;
        background: #030303;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 800ms ease;
      }

      #chapter-complete.show {
        opacity: 1;
      }

      #chapter-complete strong {
        font-size: clamp(1.4rem, 3vw, 2.2rem);
        font-weight: 500;
      }

      #chapter-complete span {
        color: #77726e;
        font-size: 0.9rem;
      }

      #room {
        position: fixed;
        inset: 0;
        perspective: 80rem;
        overflow: hidden;
      }

      .wall-face {
        position: absolute;
        inset: -3%;
        overflow: hidden;
        transform-origin: 50% 58%;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 7rem 100%,
          radial-gradient(ellipse at 50% 24%, rgba(128, 107, 87, 0.3), transparent 46%),
          linear-gradient(90deg, #171310, #2b211c 45%, #17110f);
        box-shadow: inset 0 0 9rem rgba(0, 0, 0, 0.7);
        will-change: transform, opacity;
      }

      .wall-face::before {
        content: "";
        position: absolute;
        left: -8%;
        right: -8%;
        bottom: -8%;
        height: 38%;
        z-index: 1;
        background:
          repeating-linear-gradient(90deg, transparent 0 7rem, rgba(155, 121, 95, 0.12) 7.08rem 7.18rem),
          repeating-linear-gradient(0deg, transparent 0 3rem, rgba(155, 121, 95, 0.1) 3.08rem 3.16rem),
          linear-gradient(#382a22, #100b09 82%);
        clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
      }

      .wall-face::after {
        content: "";
        position: absolute;
        left: 5%;
        right: 5%;
        bottom: 30%;
        z-index: 1;
        height: 1px;
        background: rgba(197, 164, 133, 0.2);
        box-shadow: 0 -7rem 5rem rgba(0, 0, 0, 0.24);
      }

      .hotspot {
        position: absolute;
        z-index: 2;
        border: 1px solid rgba(190, 160, 125, 0.18);
        background: rgba(28, 21, 17, 0.28);
        color: rgba(224, 204, 186, 0.34);
        display: grid;
        place-items: center;
        letter-spacing: 0.12em;
        transition: border-color 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
      }

      .scenery {
        position: absolute;
        z-index: 2;
        color: rgba(210, 190, 172, 0.2);
        display: grid;
        place-items: center;
        letter-spacing: 0.12em;
      }

      .hotspot.active {
        border-color: rgba(196, 146, 116, 0.55);
        color: rgba(232, 205, 188, 0.72);
        box-shadow: inset 0 0 2rem rgba(130, 58, 42, 0.18), 0 0 2rem rgba(118, 44, 35, 0.2);
      }

      #door {
        left: 35%;
        top: 10%;
        width: 30%;
        height: 60%;
        background:
          repeating-linear-gradient(90deg, transparent 0 1.2rem, rgba(0, 0, 0, 0.1) 1.25rem 1.35rem),
          linear-gradient(100deg, #3b2821, #120c0a);
        box-shadow: 0 0 3rem rgba(0, 0, 0, 0.72);
      }

      #wardrobe {
        left: 30%;
        top: 9%;
        width: 40%;
        height: 62%;
        background:
          linear-gradient(90deg, transparent 49.5%, rgba(190, 149, 111, 0.2) 50%, transparent 50.5%),
          linear-gradient(94deg, #453229, #17100d);
        box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.65);
      }

      #table {
        left: 22%;
        bottom: 29%;
        width: 56%;
        height: 27%;
        background:
          linear-gradient(90deg, transparent 7%, #17100d 7% 12%, transparent 12% 88%, #17100d 88% 93%, transparent 93%),
          linear-gradient(#4b352a 0 20%, transparent 20%);
        box-shadow: 0 1.2rem 2.8rem rgba(0, 0, 0, 0.58);
      }

      #coat {
        right: 15%;
        bottom: 30%;
        width: 14%;
        height: 44%;
        background:
          radial-gradient(circle at 50% 8%, #171312 0 10%, transparent 11%),
          linear-gradient(105deg, transparent 12%, #211916 13% 47%, #130f0e 48% 87%, transparent 88%);
        opacity: 0.72;
      }

      #bed {
        left: 14%;
        bottom: 30%;
        width: 72%;
        height: 30%;
        align-items: end;
        padding-bottom: 2rem;
        background:
          linear-gradient(90deg, #241a16 0 5%, transparent 5% 95%, #241a16 95%),
          linear-gradient(#493b34 0 30%, #211816 31% 78%, #110c0b 79%);
        box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.65);
      }

      #safe {
        right: 9%;
        bottom: 31%;
        width: 14%;
        height: 23%;
        border: 2px solid rgba(153, 139, 124, 0.18);
        background: linear-gradient(125deg, #292725, #0e0d0c);
      }

      #radio {
        left: 31%;
        bottom: 52%;
        width: 18%;
        height: 12%;
        border: 1px solid rgba(156, 128, 104, 0.2);
        background: linear-gradient(125deg, #342720, #100c0a);
      }

      #cursor {
        position: fixed;
        left: var(--aim-x);
        top: var(--aim-y);
        z-index: 24;
        width: 1.65rem;
        height: 1.65rem;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 244, 220, 0.96);
        border-radius: 50%;
        background: radial-gradient(circle, #fff4dc 0 2px, transparent 3px);
        box-shadow:
          0 0 0 2px rgba(0, 0, 0, 0.82),
          0 0 1.25rem rgba(255, 226, 181, 0.72);
        pointer-events: none;
        will-change: left, top;
        transition: none;
      }

      #cursor::before,
      #cursor::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        background: rgba(255, 244, 220, 0.94);
        box-shadow: 0 0 2px #000;
      }

      #cursor::before {
        width: 2.35rem;
        height: 2px;
        transform: translate(-50%, -50%);
      }

      #cursor::after {
        width: 2px;
        height: 2.35rem;
        transform: translate(-50%, -50%);
      }

      #flashlight {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        background:
          radial-gradient(circle at var(--aim-x) var(--aim-y), transparent 0 13rem, rgba(0, 0, 0, 0.08) 20rem, rgba(0, 0, 0, 0.34) 38rem);
        mix-blend-mode: multiply;
      }

      #hud {
        position: fixed;
        left: 1rem;
        top: 1rem;
        z-index: 20;
        max-width: 28rem;
        color: #8e7f78;
        font-size: 0.86rem;
        line-height: 1.6;
        text-shadow: 0 2px 10px #000;
      }

      #notice {
        position: fixed;
        left: 50%;
        bottom: 7vh;
        z-index: 46;
        min-width: min(30rem, 78vw);
        transform: translateX(-50%);
        padding: 0.85rem 1rem;
        border: 1px solid rgba(118, 78, 68, 0.45);
        background: rgba(4, 2, 2, 0.86);
        color: #cdb8ad;
        text-align: center;
        letter-spacing: 0.08em;
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      #notice.show {
        opacity: 1;
      }

      #audio-enable {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 48;
        min-height: 2.6rem;
        padding: 0.55rem 0.85rem;
        border: 1px solid rgba(174, 124, 101, 0.58);
        border-radius: 0.35rem;
        background: rgba(18, 10, 8, 0.94);
        color: #d5bdb1;
        font: 0.8rem/1.2 "Noto Sans TC", system-ui, sans-serif;
        cursor: pointer;
      }

      #audio-enable.ready {
        border-color: rgba(103, 126, 102, 0.55);
        color: #9dad9b;
      }

      #audio-enable.muted {
        border-color: rgba(130, 116, 109, 0.48);
        color: #8f817a;
      }

      #overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 44%, rgba(9, 5, 4, 0.24) 0 18%, rgba(0, 0, 0, 0.9) 76%),
          linear-gradient(rgba(2, 1, 1, 0.56), rgba(0, 0, 0, 0.84)),
          url('/assets/room307/photos/under-bed-empty.png') center / cover no-repeat;
      }

      #overlay.hidden {
        display: none;
      }

      #qr-panel {
        display: grid;
        gap: 0.85rem;
        justify-items: center;
        color: #c1ada4;
        text-align: center;
        text-shadow: 0 2px 14px #000;
      }

      #qr {
        padding: 0.18rem;
        background: #fff;
        width: min(300px, 72vw);
        height: auto;
        box-shadow: 0 0 2rem rgba(0, 0, 0, 0.8);
      }

      #join-url {
        max-width: min(34rem, 84vw);
        margin: 0;
        color: #8e817b;
        font: 0.72rem/1.5 ui-monospace, monospace;
        overflow-wrap: anywhere;
      }

      #inventory {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        grid-template-rows: auto 1fr;
        gap: 1rem;
        padding: clamp(1rem, 4vw, 3rem);
        background: rgba(5, 3, 3, 0.96);
      }

      #inventory.open {
        display: grid;
      }

      #inventory.open ~ #cursor,
      #safe-inspect.open ~ #cursor,
      #photo-inspect.open ~ #cursor,
      #desk-drawer-inspect.open ~ #cursor,
      #cardboard-box-inspect.open ~ #cursor,
      #bed-inspect.open ~ #cursor,
      #radio-inspect.open ~ #cursor,
      #drawer-puzzle.open ~ #cursor {
        z-index: 45;
        border-color: #fff2d8;
        background: rgba(255, 242, 216, 0.12);
        box-shadow:
          0 0 0 2px rgba(0, 0, 0, 0.86),
          0 0 1.4rem rgba(255, 226, 181, 0.7);
      }

      #inventory.open ~ #flashlight,
      #safe-inspect.open ~ #flashlight,
      #photo-inspect.open ~ #flashlight,
      #desk-drawer-inspect.open ~ #flashlight,
      #cardboard-box-inspect.open ~ #flashlight,
      #bed-inspect.open ~ #flashlight,
      #radio-inspect.open ~ #flashlight,
      #drawer-puzzle.open ~ #flashlight {
        opacity: 0;
      }

      #item-list {
        display: flex;
        justify-content: flex-end;
      }

      #inventory-back {
        width: 8rem;
        min-height: 3rem;
        border: 1px solid rgba(132, 93, 76, 0.38);
        background: rgba(28, 16, 13, 0.84);
        color: #b9a39a;
        display: grid;
        place-items: center;
      }

      #detail-panels {
        display: grid;
        min-height: 0;
        place-items: center;
      }

        min-height: 3rem;
        justify-self: end;
        border: 1px solid rgba(132, 93, 76, 0.38);
        background: rgba(28, 16, 13, 0.84);
        color: #b9a39a;
        display: grid;
        place-items: center;
      }

      #drawer-lock {
        --drawer-light-x: 50%;
        --drawer-light-y: 50%;
        --drawer-beam-size: clamp(8rem, 20vh, 14rem);
        position: relative;
        width: min(56vh, 92vw);
        aspect-ratio: 2 / 3;
        align-self: center;
        justify-self: center;
        background: #000;
        overflow: hidden;
      }

      #drawer-lock-model,
      #drawer-lock-light-model {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      #drawer-lock-model {
        z-index: 0;
        filter: brightness(0.95) contrast(1.04) saturate(0.58);
      }

      #drawer-lock-light-model {
        z-index: 1;
        filter: brightness(2) contrast(1.1) saturate(0.7);
        -webkit-mask-image: radial-gradient(
          circle var(--drawer-beam-size) at var(--drawer-light-x) var(--drawer-light-y),
          #000 0,
          rgba(0, 0, 0, 0.98) 28%,
          rgba(0, 0, 0, 0.68) 60%,
          transparent 100%
        );
        mask-image: radial-gradient(
          circle var(--drawer-beam-size) at var(--drawer-light-x) var(--drawer-light-y),
          #000 0,
          rgba(0, 0, 0, 0.98) 28%,
          rgba(0, 0, 0, 0.68) 60%,
          transparent 100%
        );
      }

      #drawer-flashlight-beam {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: radial-gradient(
          circle var(--drawer-beam-size) at var(--drawer-light-x) var(--drawer-light-y),
          rgba(255, 246, 211, 0.22),
          rgba(225, 211, 168, 0.085) 46%,
          transparent 76%
        );
        pointer-events: none;
      }

      #drawer-lock h2 {
        display: none;
      }

      #drawer-code-display {
        --drawer-code-size: clamp(1.2rem, 4.8vh, 2.85rem);
        position: absolute;
        z-index: 3;
        top: 18.8%;
        left: 25.9%;
        width: 48.2%;
        height: 9.4%;
        box-sizing: border-box;
        border: 1px solid rgba(80, 91, 72, 0.48);
        background: #030604;
        display: grid;
        grid-template-columns: repeat(4, var(--drawer-code-size));
        gap: clamp(0.25rem, 1.1vh, 0.72rem);
        place-content: center;
        padding: 0;
        box-shadow:
          inset 0 0 0.8rem rgba(0, 0, 0, 0.96),
          0 1px rgba(129, 137, 105, 0.12);
      }

      .drawer-code-slot {
        display: grid;
        min-width: 0;
        height: 100%;
        place-items: center;
        box-sizing: border-box;
        border: 0;
        background: transparent;
        color: #c2cda2;
        font: 500 var(--drawer-code-size)/1 ui-monospace, monospace;
        letter-spacing: 0;
        text-align: center;
        text-shadow: 0 0 0.55rem rgba(187, 204, 145, 0.48);
        box-shadow: none;
      }

      .drawer-code-slot[data-empty="true"]::after {
        content: '';
        width: 36%;
        height: 1px;
        background: rgba(125, 139, 103, 0.3);
        box-shadow: 0 0 0.3rem rgba(125, 139, 103, 0.18);
      }

      #drawer-keypad {
        position: absolute;
        z-index: 4;
        top: 32.3%;
        left: 25.6%;
        width: 49.5%;
        height: 50%;
        display: grid;
        grid-template-columns: repeat(3, 28%);
        grid-template-rows: repeat(4, 16.5%) 15.8%;
        justify-content: space-between;
        align-content: space-between;
      }

      .drawer-key[data-drawer-submit] {
        grid-column: 1 / -1;
      }

      .drawer-key {
        min-width: 0;
        min-height: 0;
        border: 1px solid transparent;
        border-radius: 0.35rem;
        background: transparent;
        color: transparent;
        display: grid;
        place-items: center;
      }

      #quick-slot {
        position: fixed;
        left: 50%;
        bottom: 1.2rem;
        z-index: 25;
        display: none;
        min-width: 13rem;
        min-height: 3.4rem;
        transform: translateX(-50%);
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0.85rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid rgba(174, 124, 101, 0.56);
        background: rgba(18, 10, 8, 0.9);
        box-shadow: 0 0.8rem 2.5rem rgba(0, 0, 0, 0.72);
        color: #d5bdb1;
      }

      #quick-slot.active {
        display: grid;
      }

      #quick-slot.active ~ #notice {
        bottom: 5.8rem;
      }

      #quick-slot span {
        color: #796963;
        font-size: 0.72rem;
      }

      #quick-slot-label {
        font-size: 0.92rem;
      }

      .selectable.active:not(.drawer-key),
      #inventory-back.active {
        outline: none;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <audio
      id="ambient-audio"
      src="/assets/audio/room307-background-v1.mp3"
      autoplay
      loop
      preload="auto"
      playsinline
      hidden
    ></audio>
    <audio
      id="bed-reach-audio"
      src="/assets/audio/bed-monster-voice-v1.mp3"
      preload="auto"
      playsinline
      hidden
    ></audio>
    <audio
      id="bed-struggle-audio"
      src="/assets/audio/bed-monster-appearance-v1.mp3"
      preload="auto"
      playsinline
      hidden
    ></audio>
    <audio
      id="bed-death-audio"
      src="/assets/audio/bed-death-impact-v1.mp3"
      preload="auto"
      playsinline
      hidden
    ></audio>
    <audio
      id="bed-player-scream-audio"
      src="/assets/audio/bed-player-scream-v1.mp3"
      preload="auto"
      playsinline
      hidden
    ></audio>
    <main id="stage">
      <div id="room-scene" aria-label="307 房間"></div>
      <section id="inventory" aria-label="物品欄">
        <div id="item-list">
          <div id="inventory-back" class="selectable" data-inventory-back="true">返回</div>
        </div>
        <div id="detail-panels">
          <div id="receipt-panel">
            <img
              id="receipt-note-image"
              src="/assets/room307/props/number-guess-note-v1.png"
              alt="寫著三組猜數字紀錄的舊便條紙"
            />
          </div>
          <div id="generic-item-panel">
            <div id="generic-item-detail">
              <img id="generic-item-image" alt="" />
              <h2 id="generic-item-name"></h2>
              <p id="generic-item-description"></p>
            </div>
          </div>
        </div>
      </section>
      <section id="safe-inspect" aria-label="保險箱近景">
        <div id="safe-inspect-frame">
          <img
            id="safe-inspect-image"
            src="/assets/room307/photos/密碼鎖.png"
            alt="衣櫃內的老舊保險箱"
          />
          <img
            id="safe-photo-layer"
            class="safe-item-layer"
            src="/assets/room307/photos/男女主角照片.png"
            alt=""
            aria-hidden="true"
          />
          <img
            id="safe-pendant-layer"
            class="safe-item-layer"
            src="/assets/inventory-icons/pendant-user.png"
            alt=""
            aria-hidden="true"
          />
          <img
            id="safe-key-layer"
            class="safe-item-layer"
            src="/assets/inventory-icons/key-user.png"
            alt=""
            aria-hidden="true"
          />
          <button
            id="safe-inspect-back"
            class="selectable"
            type="button"
            data-safe-back="true"
            aria-label="返回房間"
          >←</button>
          <div
            id="safe-keypad-hotspot"
            class="safe-inspect-hotspot selectable"
            data-safe-keypad="true"
            aria-label="保險箱密碼面板"
          ></div>
          <div
            id="safe-photo-hotspot"
            class="safe-inspect-hotspot selectable"
            data-safe-item="photo"
            aria-label="男女主角的合照"
            hidden
          ></div>
          <div
            id="safe-pendant-hotspot"
            class="safe-inspect-hotspot selectable"
            data-safe-item="pendant"
            aria-label="錄音吊飾"
            hidden
          ></div>
          <div
            id="safe-key-hotspot"
            class="safe-inspect-hotspot selectable"
            data-safe-item="smallKey"
            aria-label="鑰匙"
            hidden
          ></div>
        </div>
      </section>
      <section id="photo-inspect" aria-label="合照檢視">
        <div id="photo-inspect-frame">
          <button
            id="photo-inspect-back"
            class="selectable"
            type="button"
            data-photo-back="true"
            aria-label="返回房間"
          >←</button>
          <button
            id="photo-card"
            class="selectable"
            type="button"
            data-photo-card="true"
            aria-label="翻看照片背面"
          >
            <span id="photo-front">
              <img
                src="/assets/room307/photos/男女主角照片.png"
                alt="男女主角的合照"
              />
            </span>
            <span id="photo-rear" aria-label="照片背面的文字">
              <p>你總想把所有人帶回來。</p>
              <p>如果又被那場火困住，</p>
              <p>就握住吊飾。</p>
              <p>這一次，換我帶你回來。</p>
            </span>
            <img id="photo-frame-overlay" alt="" aria-hidden="true" />
          </button>
        </div>
      </section>
      <section id="desk-drawer-inspect" aria-label="書桌抽屜近景">
        <div id="desk-drawer-inspect-frame">
          <img
            id="desk-drawer-inspect-image"
            src="/assets/room307/props/open-drawer-realistic.png"
            alt="打開的老舊木製書桌抽屜"
          />
          <img
            id="drawer-tape-layer"
            class="desk-drawer-item"
            src="/assets/inventory-icons/cassette-environment.png"
            alt=""
            aria-hidden="true"
          />
          <img
            id="drawer-battery-layer"
            class="desk-drawer-item"
            src="/assets/inventory-icons/battery-environment.png"
            alt=""
            aria-hidden="true"
          />
          <img
            id="drawer-box-cutter-layer"
            class="desk-drawer-item"
            src="/assets/inventory-icons/utility-knife-v1.png"
            alt=""
            aria-hidden="true"
          />
          <button
            id="desk-drawer-back"
            class="selectable"
            type="button"
            data-desk-drawer-back="true"
            aria-label="返回房間"
          >←</button>
          <button
            id="desk-drawer-door-hotspot"
            class="selectable"
            type="button"
            data-desk-drawer-door="true"
            aria-label="開啟抽屜"
          ></button>
          <button
            id="drawer-tape-hotspot"
            class="desk-drawer-hotspot selectable"
            type="button"
            data-desk-drawer-item="tape"
            aria-label="錄音磁帶"
          ></button>
          <button
            id="drawer-battery-hotspot"
            class="desk-drawer-hotspot selectable"
            type="button"
            data-desk-drawer-item="oldBattery"
            aria-label="舊電池"
          ></button>
          <button
            id="drawer-box-cutter-hotspot"
            class="desk-drawer-hotspot selectable"
            type="button"
            data-desk-drawer-item="boxCutter"
            aria-label="美工刀"
          ></button>
        </div>
      </section>
      <section id="cardboard-box-inspect" aria-label="紙箱近景">
        <div id="cardboard-box-inspect-frame">
          <img
            id="cardboard-box-inspect-image"
            src="/assets/room307/photos/cardboard-box-closeup-closed-v1.png"
            alt="封箱膠帶仍未割開的舊紙箱"
          />
          <div id="cardboard-box-cut-progress" aria-hidden="true"></div>
          <button
            id="cardboard-box-back"
            class="selectable"
            type="button"
            data-cardboard-box-back="true"
            aria-label="返回房間"
          >←</button>
          <button
            id="cardboard-box-open-hotspot"
            class="selectable"
            type="button"
            data-cardboard-box-open="true"
            aria-label="割開紙箱的封箱膠帶"
          >
            <img
              id="cardboard-box-cut-tool"
              src="/assets/inventory-icons/utility-knife-v1.png"
              alt=""
              aria-hidden="true"
            />
          </button>
          <button
            id="cardboard-box-gear-hotspot"
            class="selectable"
            type="button"
            data-cardboard-box-gear="true"
            aria-label="拾取消防衣與頭盔"
            hidden
          ></button>
        </div>
      </section>
      <section id="bed-inspect" aria-label="床底近景">
        <div id="bed-inspect-frame">
          <img
            id="bed-inspect-image"
            src="/assets/room307/photos/under-bed-antenna.png"
            alt="昏暗的床底與地上的天線"
          />
          <video
            id="bed-scare-video"
            class="bed-event-video"
            src="/assets/room307/videos/bed-under-scare.webm"
            poster="/assets/room307/photos/under-bed-antenna.png"
            preload="auto"
            playsinline
          ></video>
          <video
            id="bed-struggle-video"
            class="bed-event-video"
            src="/assets/room307/videos/bed-under-struggle-success-v2.webm"
            preload="auto"
            playsinline
          ></video>
          <video
            id="bed-death-video"
            class="bed-event-video"
            src="/assets/room307/videos/bed-under-death-v17.webm"
            preload="auto"
            playsinline
          ></video>
          <div id="bed-escape-prompt" role="status" aria-live="assertive">
            <strong>用力晃動手機！</strong>
            <span id="bed-escape-countdown">在 4.0 秒內掙脫鬼手</span>
            <div id="bed-escape-meter" aria-hidden="true">
              <i id="bed-escape-progress"></i>
            </div>
          </div>
          <section id="bed-death-menu" role="dialog" aria-modal="true" aria-label="死亡">
            <strong>死亡</strong>
            <button
              class="bed-death-action selectable"
              type="button"
              data-bed-death-restart="true"
            >
              重新開始
            </button>
            <button
              class="bed-death-action selectable"
              type="button"
              data-bed-death-close="true"
            >
              關閉遊戲
            </button>
          </section>
          <button
            id="bed-antenna-hotspot"
            class="selectable"
            type="button"
            data-bed-antenna="true"
            aria-label="撿起床底的天線"
          ></button>
        </div>
      </section>
      <section id="radio-inspect" aria-label="收錄音機近景">
        <div id="radio-inspect-frame">
          <img
            id="radio-inspect-image"
            src="/assets/room307/photos/recorder-closeup-empty.png"
            alt="桌上的老舊收錄音機"
          />
          <button
            id="radio-device-hotspot"
            class="selectable"
            type="button"
            data-radio-device="true"
            aria-label="操作收錄音機"
          ></button>
        </div>
      </section>
      <section id="drawer-puzzle" aria-label="保險箱密碼鎖">
        <div id="drawer-back" class="selectable" data-drawer-back="true">返回</div>
        <div id="drawer-lock">
          <h2>保險箱</h2>
          <img
            id="drawer-lock-model"
            src="/assets/room307/photos/keypad-blood-fingerprint-v1.png"
            alt="老舊的保險箱密碼鎖"
          />
          <img
            id="drawer-lock-light-model"
            src="/assets/room307/photos/keypad-blood-fingerprint-v1.png"
            alt=""
            aria-hidden="true"
          />
          <div id="drawer-flashlight-beam" aria-hidden="true"></div>
          <output id="drawer-code-display" aria-label="尚未輸入密碼">
            <span class="drawer-code-slot" data-empty="true"></span>
            <span class="drawer-code-slot" data-empty="true"></span>
            <span class="drawer-code-slot" data-empty="true"></span>
            <span class="drawer-code-slot" data-empty="true"></span>
          </output>
          <div id="drawer-keypad">
            <div class="drawer-key selectable" data-drawer-digit="1">1</div>
            <div class="drawer-key worn selectable" data-drawer-digit="2">2</div>
            <div class="drawer-key selectable" data-drawer-digit="3">3</div>
            <div class="drawer-key worn selectable" data-drawer-digit="4">4</div>
            <div class="drawer-key selectable" data-drawer-digit="5">5</div>
            <div class="drawer-key worn selectable" data-drawer-digit="6">6</div>
            <div class="drawer-key selectable" data-drawer-digit="7">7</div>
            <div class="drawer-key worn selectable" data-drawer-digit="8">8</div>
            <div class="drawer-key selectable" data-drawer-digit="9">9</div>
            <div class="drawer-key command selectable" data-drawer-reset="true">RESET</div>
            <div class="drawer-key selectable" data-drawer-digit="0">0</div>
            <div class="drawer-key command selectable" data-drawer-delete="true">DELETE</div>
            <div class="drawer-key command selectable" data-drawer-submit="true">ENTER</div>
          </div>
        </div>
      </section>
      <div id="cursor"></div>
      <div id="flashlight"></div>
      <div id="quick-slot">
        <span>使用中</span>
        <strong id="quick-slot-label">無</strong>
      </div>
      <section id="hud">
        <div>307｜開端</div>
        <div id="status">等待手機連線。</div>
        <div id="target" hidden></div>
        <div id="held-item">目前道具：無</div>
      </section>
      <button id="audio-enable" type="button" aria-pressed="false">靜音</button>
      <div id="notice"></div>
      <section id="chapter-complete" aria-live="polite">
        <strong>第一章｜開端</strong>
        <span>完成</span>
      </section>
      <section id="overlay">
        <div id="qr-panel">
          <h1>掃描手機控制器</h1>
          <canvas id="qr"></canvas>
          <p id="join-url"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/prototype/host.ts"></script>
  </body>
